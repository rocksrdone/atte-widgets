<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanning Dashboard</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
:root {
  --ink: #1A1614;
  --paper: #F7F3EE;
  --warm: #E8DFD4;
  --rule: #D4C9BC;
  --accent: #8B3A2A;
  --teal: #3A8B7A;
  --teal-light: #E5F2EF;
  --gold: #B07D2A;
  --gold-light: #F5EDD8;
  --done-bg: #EAF3DE;
  --done-border: #639922;
  --done-text: #27500A;
  --warn-bg: #FFF8E1;
  --warn-border: #F0B429;
  --warn-text: #7B5E00;
  --muted: #8B7D72;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  line-height: 1.5;
  padding: 14px;
}
.header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 12px; gap: 8px;
}
.header-title { font-family: 'Libre Baskerville', serif; font-size: 18px; font-weight: 700; }
.header-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.item-bar {
  background: white; border: 1px solid var(--rule); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.item-id { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; color: var(--accent); }
.item-title { font-family: 'Libre Baskerville', serif; font-size: 14px; font-weight: 700; flex: 1; }
.badge {
  font-size: 10px; padding: 2px 7px; border-radius: 4px;
  font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
}
.badge-parts { background: var(--gold-light); color: var(--gold); }
.badge-stock { background: var(--teal-light); color: var(--teal); }
.badge-sold { background: var(--done-bg); color: var(--done-text); }
.tabs { display: flex; gap: 2px; margin-bottom: 0; }
.tab {
  padding: 6px 14px; font-size: 12px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--rule); border-radius: 6px 6px 0 0;
  background: var(--warm); color: var(--muted); border-bottom: none;
}
.tab.active { background: white; color: var(--ink); border-bottom: 1px solid white; margin-bottom: -1px; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.section {
  background: white; border: 1px solid var(--rule); border-radius: 0 8px 8px 8px;
  padding: 12px 14px; margin-bottom: 10px;
}
/* Steps */
.step-list { display: flex; flex-direction: column; gap: 8px; }
.step {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--paper);
}
.step.done { background: var(--done-bg); border-color: var(--done-border); }
.step.active { background: white; border-color: var(--accent); border-width: 2px; }
.step.pending { opacity: .55; }
.step-icon {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
}
.step.done .step-icon { background: var(--done-border); color: white; }
.step.active .step-icon { background: var(--accent); color: white; }
.step.pending .step-icon { background: var(--warm); color: var(--muted); }
.step-body { flex: 1; }
.step-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.step-desc { font-size: 11px; color: var(--muted); margin-bottom: 6px; line-height: 1.6; }
.cmd-box {
  font-family: 'DM Mono', monospace; font-size: 10px;
  background: var(--ink); color: #C8BFAF;
  padding: 6px 10px; border-radius: 5px; margin-bottom: 4px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.cmd-text { flex: 1; }
.copy-btn {
  font-size: 9px; padding: 2px 6px; background: #3a342c; border: none;
  border-radius: 3px; color: #C8BFAF; cursor: pointer; white-space: nowrap;
}
.copy-btn:hover { background: var(--accent); color: white; }
.copy-btn.copied { background: var(--done-border); color: white; }
.step-note { font-size: 11px; color: var(--done-text); margin-top: 4px; font-style: italic; }
/* Status */
.status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.status-item {
  padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--paper);
}
.status-item.ok { background: var(--done-bg); border-color: var(--done-border); }
.status-item.na { opacity: .5; }
.status-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.status-val { font-size: 12px; font-weight: 600; margin-top: 1px; }
.status-item.ok .status-val { color: var(--done-text); }
/* Scans list */
.scan-list { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
.scan-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  border: 1px solid var(--rule); border-radius: 6px; background: var(--paper);
  font-size: 11px;
}
.scan-id { font-family: 'DM Mono', monospace; color: var(--accent); min-width: 120px; }
.scan-pd { font-size: 10px; padding: 1px 6px; border-radius: 3px; }
.pd-ok { background: var(--done-bg); color: var(--done-text); }
.pd-warn { background: var(--warn-bg); color: var(--warn-text); }
.pd-na { background: var(--warm); color: var(--muted); }
.empty-state { text-align: center; color: var(--muted); padding: 40px 20px; font-style: italic; }
.refresh-btn { font-size: 11px; padding: 4px 10px; border-radius: 5px; cursor: pointer; border: 1px solid var(--rule); background: white; color: var(--muted); float: right; margin-bottom: 8px; }
.refresh-btn:hover { border-color: var(--accent); color: var(--ink); }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">Scanning Dashboard</div>
    <div class="header-sub" id="headerSub">Select an item in the Items table</div>
  </div>
  <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
</div>

<div id="content">
  <div class="empty-state">Select a row in the Items table to begin</div>
</div>

<script>
let currentItem = null;
let allScans = [];
let activeTab = 'workflow';

grist.ready({ requiredAccess: 'full', columns: [] });

grist.onRecord(async (record) => {
  if (!record || !record.item_id) {
    document.getElementById('content').innerHTML =
      '<div class="empty-state">Select a row in the Items table to begin</div>';
    currentItem = null;
    return;
  }
  currentItem = record;
  await loadData();
});

async function loadData() {
  if (!currentItem) return;
  document.getElementById('headerSub').textContent = `${currentItem.item_id} · loading...`;
  try {
    const scansData = await grist.docApi.fetchTable('Scans');
    const ids = scansData.id || [];
    allScans = ids.map((id, i) => ({
      id,
      scan_id: col(scansData, 'scan_id', i),
      source_item_id: col(scansData, 'source_item_id', i),
      page_side: col(scansData, 'page_side', i),
      pd_status: col(scansData, 'pd_status', i),
      status: col(scansData, 'status', i),
      master_filename: col(scansData, 'master_filename', i),
    }));
  } catch(e) { allScans = []; }
  render();
  document.getElementById('headerSub').textContent = `${currentItem.item_id} · ${currentItem.title || ''}`;
}

function col(table, name, i) {
  return Array.isArray(table[name]) ? (table[name][i] ?? '') : '';
}

function render() {
  const item = currentItem;
  const itemScans = allScans.filter(s => {
    const sid = String(s.source_item_id || '');
    return sid === String(item.id) || sid === item.item_id;
  });

  const willScan = item.will_be_scanned === 'Yes';
  const hasCzur = true; // We derive from Grist fields — assume czur done if scans exist or item entered
  const hasScans = itemScans.length > 0;
  const verifiedScans = itemScans.filter(s => s.pd_status === 'Verified PD').length;
  const allVerified = hasScans && verifiedScans === itemScans.length;
  const anyListed = (item.status === 'Listed' || item.status === 'Sold');

  const statusBadge = item.status === 'Sold' ? 'badge-sold' :
    (item.status || '').includes('Parts') ? 'badge-parts' : 'badge-stock';

  // Steps: what's done based on Grist data
  const step1done = true; // item exists in Grist = entered
  const step2done = willScan ? hasScans : true;
  const step3done = willScan ? allVerified : true;
  const step4done = anyListed;

  function sc(done, isNext) {
    return done ? 'done' : isNext ? 'active' : 'pending';
  }
  const nextStep = !step1done ? 1 : !step2done ? 2 : !step3done ? 3 : !step4done ? 4 : 5;

  const itemId = item.item_id || '—';

  document.getElementById('content').innerHTML = `
    <div class="item-bar">
      <div class="item-id">${itemId}</div>
      <div class="item-title">${item.title || 'Untitled'}</div>
      <div style="font-size:11px;color:var(--muted)">${item.era || ''} ${item.category || ''}</div>
      <span class="badge ${statusBadge}">${item.status || 'In stock'}</span>
    </div>

    <div class="tabs">
      <div class="tab ${activeTab==='workflow'?'active':''}" onclick="switchTab('workflow')">Workflow</div>
      <div class="tab ${activeTab==='scans'?'active':''}" onclick="switchTab('scans')">Scans (${itemScans.length})</div>
      <div class="tab ${activeTab==='status'?'active':''}" onclick="switchTab('status')">Status</div>
    </div>

    <!-- WORKFLOW TAB -->
    <div class="tab-content ${activeTab==='workflow'?'active':''}" id="tab-workflow">
      <div class="section">
        <div class="step-list">

          <div class="step done">
            <div class="step-icon">✓</div>
            <div class="step-body">
              <div class="step-title">Item entered in Grist</div>
              <div class="step-desc">Physical item logged with title, category, condition, source, and cost.</div>
            </div>
          </div>

          ${willScan ? `
          <div class="step ${sc(false, nextStep===2)} ">
            <div class="step-icon">${false ? '✓' : '2'}</div>
            <div class="step-body">
              <div class="step-title">CZUR scan — full item</div>
              <div class="step-desc">Scan every page in CZUR Studio. Then run czur_combine.sh to bundle into a PDF.</div>
              <div class="cmd-box">
                <span class="cmd-text">~/atte-scanner/czur_combine.sh</span>
                <button class="copy-btn" onclick="copyCmd(this, '~/atte-scanner/czur_combine.sh')">Copy</button>
              </div>
            </div>
          </div>

          <div class="step ${sc(hasScans, nextStep===3)}">
            <div class="step-icon">${hasScans ? '✓' : '3'}</div>
            <div class="step-body">
              <div class="step-title">Flatbed scan — image pages</div>
              <div class="step-desc">Scan image-rich pages on the Epson 13000XL. VueScan saves TIFFs automatically to the pages/ subfolder.</div>
              <div class="cmd-box">
                <span class="cmd-text">~/atte-scanner/scan.sh → pick profile → pick ${itemId}</span>
                <button class="copy-btn" onclick="copyCmd(this, '~/atte-scanner/scan.sh')">Copy</button>
              </div>
              ${hasScans ? `<div class="step-note">✓ ${itemScans.length} scan(s) registered in Grist</div>` : ''}
            </div>
          </div>

          <div class="step ${sc(hasScans, nextStep===4)}">
            <div class="step-icon">${hasScans ? '✓' : '4'}</div>
            <div class="step-body">
              <div class="step-title">Set page map</div>
              <div class="step-desc">Tell the processor which PDF pages your flatbed scans replace. Run before placing files in incoming/.</div>
              <div class="cmd-box">
                <span class="cmd-text">~/atte-scanner/pagemap_helper.sh</span>
                <button class="copy-btn" onclick="copyCmd(this, '~/atte-scanner/pagemap_helper.sh')">Copy</button>
              </div>
            </div>
          </div>

          <div class="step ${sc(hasScans, nextStep===5)}">
            <div class="step-icon">${hasScans ? '✓' : '5'}</div>
            <div class="step-body">
              <div class="step-title">Process — build PDF + derivatives</div>
              <div class="step-desc">Drop CZUR PDF into incoming/${itemId}/. Processor runs automatically, replaces pages, runs OCR, generates JPG and PNG.</div>
              <div class="cmd-box">
                <span class="cmd-text">python3 ~/atte-processor/atte_processor.py</span>
                <button class="copy-btn" onclick="copyCmd(this, 'python3 ~/atte-processor/atte_processor.py')">Copy</button>
              </div>
              <div style="margin-top:4px;font-size:10px;color:var(--muted)">
                Incoming: ~/atte-workspace/incoming/${itemId}/${itemId}_czur.pdf
              </div>
            </div>
          </div>

          <div class="step ${sc(allVerified, nextStep===6)}">
            <div class="step-icon">${allVerified ? '✓' : hasScans ? '6' : '6'}</div>
            <div class="step-body">
              <div class="step-title">PD verification</div>
              <div class="step-desc">Verify public domain status for each scan. Update pd_status in the Scans table.</div>
              <div style="margin-top:4px;font-size:11px">
                ${hasScans
                  ? `${verifiedScans} of ${itemScans.length} scan(s) verified`
                  : 'No scans registered yet'}
              </div>
            </div>
          </div>

          <div class="step ${sc(anyListed, false)}">
            <div class="step-icon">${anyListed ? '✓' : '7'}</div>
            <div class="step-body">
              <div class="step-title">List for sale</div>
              <div class="step-desc">Create listing on eBay, Etsy, or Shopify. Update listing fields in Grist.</div>
            </div>
          </div>
          ` : `
          <div class="step ${sc(anyListed, nextStep===2)}">
            <div class="step-icon">${anyListed ? '✓' : '2'}</div>
            <div class="step-body">
              <div class="step-title">List for sale</div>
              <div class="step-desc">Create listing on eBay, Etsy, or Shopify. Update listing fields in Grist.</div>
            </div>
          </div>
          `}

        </div>
      </div>
    </div>

    <!-- SCANS TAB -->
    <div class="tab-content ${activeTab==='scans'?'active':''}" id="tab-scans">
      <div class="section">
        ${itemScans.length > 0 ? `
          <div style="font-size:11px;color:var(--muted);margin-bottom:8px">
            ${verifiedScans} of ${itemScans.length} scan(s) PD verified
          </div>
          <div class="scan-list">
            ${itemScans.map(s => `
              <div class="scan-row">
                <div class="scan-id">${s.scan_id || '—'}</div>
                <div style="flex:1;color:var(--muted)">${s.page_side || '—'}</div>
                <span class="scan-pd ${
                  s.pd_status === 'Verified PD' ? 'pd-ok' :
                  s.pd_status === 'Not PD - do not list' ? 'pd-warn' : 'pd-na'
                }">${s.pd_status || 'Needs research'}</span>
              </div>
            `).join('')}
          </div>
        ` : `<div style="color:var(--muted);font-style:italic;font-size:12px;padding:12px 0">No scans registered for this item yet.</div>`}
      </div>
    </div>

    <!-- STATUS TAB -->
    <div class="tab-content ${activeTab==='status'?'active':''}" id="tab-status">
      <div class="section">
        <div class="status-grid">
          <div class="status-item ok">
            <div class="status-label">In Grist</div>
            <div class="status-val">✓ Entered</div>
          </div>
          <div class="status-item ${willScan ? '' : 'na'}">
            <div class="status-label">Will be scanned</div>
            <div class="status-val">${willScan ? 'Yes' : 'No'}</div>
          </div>
          <div class="status-item ${hasScans ? 'ok' : ''}">
            <div class="status-label">Scans registered</div>
            <div class="status-val">${itemScans.length} scan(s)</div>
          </div>
          <div class="status-item ${allVerified ? 'ok' : hasScans ? '' : 'na'}">
            <div class="status-label">PD verified</div>
            <div class="status-val">${hasScans ? `${verifiedScans} / ${itemScans.length}` : 'N/A'}</div>
          </div>
          <div class="status-item ${anyListed ? 'ok' : ''}">
            <div class="status-label">Listed</div>
            <div class="status-val">${item.status || 'Not listed'}</div>
          </div>
          <div class="status-item">
            <div class="status-label">Cost basis</div>
            <div class="status-val">$${item.cost_basis_usd || '0.00'}</div>
          </div>
        </div>

        <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--rule)">
          <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Quick commands</div>
          <div class="cmd-box" style="margin-bottom:4px">
            <span class="cmd-text">~/atte-scanner/scan.sh</span>
            <button class="copy-btn" onclick="copyCmd(this, '~/atte-scanner/scan.sh')">Copy</button>
          </div>
          <div class="cmd-box" style="margin-bottom:4px">
            <span class="cmd-text">~/atte-scanner/czur_combine.sh</span>
            <button class="copy-btn" onclick="copyCmd(this, '~/atte-scanner/czur_combine.sh')">Copy</button>
          </div>
          <div class="cmd-box" style="margin-bottom:4px">
            <span class="cmd-text">~/atte-scanner/pagemap_helper.sh</span>
            <button class="copy-btn" onclick="copyCmd(this, '~/atte-scanner/pagemap_helper.sh')">Copy</button>
          </div>
          <div class="cmd-box">
            <span class="cmd-text">python3 ~/atte-processor/atte_processor.py</span>
            <button class="copy-btn" onclick="copyCmd(this, 'python3 ~/atte-processor/atte_processor.py')">Copy</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function switchTab(tab) {
  activeTab = tab;
  render();
}

function copyCmd(btn, cmd) {
  navigator.clipboard.writeText(cmd).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}
</script>
</body>
</html>
