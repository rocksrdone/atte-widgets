<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanning Dashboard</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
:root {
  --ink: #1A1614;
  --paper: #F7F3EE;
  --warm: #E8DFD4;
  --rule: #D4C9BC;
  --accent: #8B3A2A;
  --accent-light: #F2E8E5;
  --teal: #3A8B7A;
  --teal-light: #E5F2EF;
  --gold: #B07D2A;
  --gold-light: #F5EDD8;
  --done-bg: #EAF3DE;
  --done-border: #639922;
  --done-text: #27500A;
  --warn-bg: #FFF8E1;
  --warn-border: #F0B429;
  --warn-text: #7B5E00;
  --muted: #8B7D72;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  line-height: 1.5;
  padding: 14px;
}
.header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 12px; gap: 8px;
}
.header-title { font-family: 'Libre Baskerville', serif; font-size: 18px; font-weight: 700; }
.header-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.bridge-status {
  font-family: 'DM Mono', monospace; font-size: 10px;
  padding: 3px 8px; border-radius: 4px; white-space: nowrap;
}
.bridge-ok { background: var(--done-bg); color: var(--done-text); }
.bridge-err { background: var(--warn-bg); color: var(--warn-text); }

/* Item bar */
.item-bar {
  background: white; border: 1px solid var(--rule); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.item-id { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; color: var(--accent); }
.item-title { font-family: 'Libre Baskerville', serif; font-size: 14px; font-weight: 700; flex: 1; }
.badge {
  font-size: 10px; padding: 2px 7px; border-radius: 4px;
  font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
}
.badge-parts { background: var(--gold-light); color: var(--gold); }
.badge-stock { background: var(--teal-light); color: var(--teal); }
.badge-sold { background: var(--done-bg); color: var(--done-text); }

/* Tabs */
.tabs { display: flex; gap: 2px; margin-bottom: 10px; }
.tab {
  padding: 6px 14px; font-size: 12px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--rule); border-radius: 6px 6px 0 0;
  background: var(--warm); color: var(--muted);
  border-bottom: none;
}
.tab.active { background: white; color: var(--ink); border-bottom: 1px solid white; margin-bottom: -1px; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Section */
.section {
  background: white; border: 1px solid var(--rule); border-radius: 0 8px 8px 8px;
  padding: 12px 14px; margin-bottom: 10px;
}

/* Workflow steps */
.step-list { display: flex; flex-direction: column; gap: 8px; }
.step {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--paper);
}
.step.done { background: var(--done-bg); border-color: var(--done-border); }
.step.active { background: white; border-color: var(--accent); border-width: 2px; }
.step.pending { opacity: .6; }
.step-icon {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
}
.step.done .step-icon { background: var(--done-border); color: white; }
.step.active .step-icon { background: var(--accent); color: white; }
.step.pending .step-icon { background: var(--warm); color: var(--muted); }
.step-body { flex: 1; }
.step-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.step-desc { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.step-cmd {
  font-family: 'DM Mono', monospace; font-size: 10px;
  background: var(--warm); padding: 3px 7px; border-radius: 4px;
  color: var(--ink); display: inline-block; margin-bottom: 6px;
}
.step-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn {
  font-size: 11px; padding: 5px 11px; border-radius: 5px; cursor: pointer;
  border: 1px solid var(--rule); background: white; color: var(--ink);
  font-family: 'Inter', sans-serif; transition: all .15s;
}
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn-primary:hover { opacity: .9; }
.btn-teal { background: var(--teal); border-color: var(--teal); color: white; }
.btn-teal:hover { opacity: .9; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* Status grid */
.status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.status-item {
  padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--paper);
}
.status-item.ok { background: var(--done-bg); border-color: var(--done-border); }
.status-item.warn { background: var(--warn-bg); border-color: var(--warn-border); }
.status-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.status-val { font-size: 12px; font-weight: 600; margin-top: 1px; }
.status-item.ok .status-val { color: var(--done-text); }
.status-item.warn .status-val { color: var(--warn-text); }

/* Log */
.log-box {
  background: var(--ink); color: #B0A898;
  font-family: 'DM Mono', monospace; font-size: 10px;
  border-radius: 6px; padding: 8px 10px;
  max-height: 140px; overflow-y: auto; margin-top: 8px;
}
.log-line { margin-bottom: 1px; }
.log-line.ok { color: #6DBF8F; }
.log-line.err { color: #E07070; }
.log-line.info { color: #7DB8D4; }

/* Processor bar */
.processor-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border: 1px solid var(--rule); border-radius: 6px;
  background: white; margin-bottom: 8px; font-size: 12px;
}
.proc-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.proc-dot.running { background: var(--teal); animation: pulse 2s infinite; }
.proc-dot.stopped { background: var(--rule); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.empty-state { text-align: center; color: var(--muted); padding: 40px 20px; font-style: italic; }
.refresh-row { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">Scanning Dashboard</div>
    <div class="header-sub" id="headerSub">Select an item in the Items table</div>
  </div>
  <div id="bridgeStatus" class="bridge-status bridge-err">Bridge offline</div>
</div>

<div id="content">
  <div class="empty-state">Select a row in the Items table to begin</div>
</div>

<script>
const BRIDGE = 'http://127.0.0.1:7742';
let currentItem = null;
let statusData = null;
let activeTab = 'workflow';
let bridgeOk = false;
let refreshInterval = null;

// ── GRIST ─────────────────────────────────────────────────────────────────────
grist.ready({ requiredAccess: 'full', columns: [] });

grist.onRecord(async (record) => {
  if (!record || !record.item_id) {
    document.getElementById('content').innerHTML =
      '<div class="empty-state">Select a row in the Items table to begin</div>';
    currentItem = null;
    clearInterval(refreshInterval);
    return;
  }
  currentItem = record;
  await refresh();
  clearInterval(refreshInterval);
  refreshInterval = setInterval(refresh, 8000);
});

// ── BRIDGE CHECK ──────────────────────────────────────────────────────────────
async function checkBridge() {
  try {
    const r = await fetch(`${BRIDGE}/health`, { signal: AbortSignal.timeout(2000) });
    bridgeOk = r.ok;
  } catch { bridgeOk = false; }
  const el = document.getElementById('bridgeStatus');
  el.textContent = bridgeOk ? '● Bridge online' : '● Bridge offline';
  el.className = 'bridge-status ' + (bridgeOk ? 'bridge-ok' : 'bridge-err');
}

// ── REFRESH ───────────────────────────────────────────────────────────────────
async function refresh() {
  await checkBridge();
  if (!currentItem) return;
  document.getElementById('headerSub').textContent = `${currentItem.item_id} · refreshing...`;

  if (bridgeOk) {
    try {
      const r = await fetch(`${BRIDGE}/status/${currentItem.item_id}`);
      statusData = await r.json();
    } catch { statusData = null; }

    try {
      const r = await fetch(`${BRIDGE}/processor/status`);
      const proc = await r.json();
      window.processorData = proc;
    } catch { window.processorData = null; }
  }

  render();
  document.getElementById('headerSub').textContent =
    `${currentItem.item_id} · ${currentItem.title || ''}`;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  const item = currentItem;
  const s = statusData;
  const proc = window.processorData;

  const statusBadge = item.status === 'Sold' ? 'badge-sold' :
    (item.status || '').includes('Parts') ? 'badge-parts' : 'badge-stock';

  // Determine step states
  const stepCzur     = s ? s.step_czur : false;
  const stepFlatbed  = s ? s.step_flatbed : false;
  const stepPagemap  = s ? s.step_pagemap : false;
  const stepProcess  = s ? s.step_processed : false;
  const stepDerivs   = s ? s.step_derivatives : false;
  const willScan     = (item.will_be_scanned === 'Yes');

  function stepClass(done, isNext) {
    return done ? 'done' : isNext ? 'active' : 'pending';
  }

  const nextStep = !stepCzur ? 1 : !stepFlatbed && willScan ? 2 :
    !stepPagemap && willScan ? 3 : !stepProcess ? 4 : !stepDerivs ? 5 : 6;

  document.getElementById('content').innerHTML = `
    <div class="item-bar">
      <div class="item-id">${item.item_id || '—'}</div>
      <div class="item-title">${item.title || 'Untitled'}</div>
      <div style="font-size:11px;color:var(--muted)">${item.era || ''} ${item.category || ''}</div>
      <span class="badge ${statusBadge}">${item.status || 'In stock'}</span>
    </div>

    <!-- Processor bar -->
    <div class="processor-bar">
      <div class="proc-dot ${proc && proc.running ? 'running' : 'stopped'}"></div>
      <span style="font-weight:500">Processor ${proc && proc.running ? 'running' : 'stopped'}</span>
      <span style="flex:1"></span>
      ${!proc || !proc.running
        ? `<button class="btn btn-teal" onclick="runAction('process')">Start processor</button>`
        : `<span style="font-size:11px;color:var(--muted)">Auto-processing enabled</span>`}
    </div>

    <div class="refresh-row">
      <button class="btn" onclick="refresh()">↻ Refresh</button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab ${activeTab==='workflow'?'active':''}" onclick="switchTab('workflow')">Workflow</div>
      <div class="tab ${activeTab==='status'?'active':''}" onclick="switchTab('status')">Status</div>
      <div class="tab ${activeTab==='log'?'active':''}" onclick="switchTab('log')">Log</div>
    </div>

    <!-- WORKFLOW TAB -->
    <div class="tab-content ${activeTab==='workflow'?'active':''}" id="tab-workflow">
      <div class="section">
        <div class="step-list">

          <!-- Step 1: CZUR scan -->
          <div class="step ${stepClass(stepCzur, nextStep===1)}">
            <div class="step-icon">${stepCzur ? '✓' : '1'}</div>
            <div class="step-body">
              <div class="step-title">CZUR scan — full item</div>
              <div class="step-desc">Scan every page with CZUR Studio. Export as PDF, move to incoming folder.</div>
              <div class="step-cmd">CZUR Studio → Export PDF → czur_combine.sh</div>
              <div class="step-actions">
                <button class="btn btn-primary" onclick="runAction('czur-combine')" ${!bridgeOk?'disabled':''}>
                  Run czur_combine.sh
                </button>
                <span style="font-size:10px;color:var(--muted)">or: ~/atte-scanner/czur_combine.sh</span>
              </div>
              ${s && s.czur_pdf_name ? `<div style="margin-top:5px;font-size:11px;color:var(--done-text)">✓ ${s.czur_pdf_name}</div>` : ''}
            </div>
          </div>

          <!-- Step 2: Flatbed scan (conditional) -->
          ${willScan ? `
          <div class="step ${stepClass(stepFlatbed, nextStep===2)}">
            <div class="step-icon">${stepFlatbed ? '✓' : '2'}</div>
            <div class="step-body">
              <div class="step-title">Flatbed scan — image pages</div>
              <div class="step-desc">Scan image-rich pages on the Epson 13000XL. VueScan saves TIFFs automatically.</div>
              <div class="step-cmd">scan.sh → pick profile → pick item</div>
              <div class="step-actions">
                <button class="btn btn-primary" onclick="runAction('scan')" ${!bridgeOk?'disabled':''}>
                  Open scan launcher
                </button>
                <span style="font-size:10px;color:var(--muted)">or: ~/atte-scanner/scan.sh</span>
              </div>
              ${s && s.tiffs_in_workspace > 0 ? `<div style="margin-top:5px;font-size:11px;color:var(--done-text)">✓ ${s.tiffs_in_workspace} TIFF(s) in workspace</div>` : ''}
            </div>
          </div>

          <!-- Step 3: Pagemap -->
          <div class="step ${stepClass(stepPagemap, nextStep===3)}">
            <div class="step-icon">${stepPagemap ? '✓' : '3'}</div>
            <div class="step-body">
              <div class="step-title">Set page map</div>
              <div class="step-desc">Tell the processor which PDF pages your flatbed scans replace.</div>
              <div class="step-cmd">pagemap_helper.sh</div>
              <div class="step-actions">
                <button class="btn btn-primary" onclick="runAction('pagemap')" ${!bridgeOk?'disabled':''}>
                  Open pagemap helper
                </button>
                <span style="font-size:10px;color:var(--muted)">or: ~/atte-scanner/pagemap_helper.sh</span>
              </div>
              ${s && s.pagemap_contents ? `
                <div style="margin-top:5px;font-size:10px;font-family:monospace;background:var(--warm);padding:4px 7px;border-radius:4px">
                  ${s.pagemap_contents.replace(/\n/g,'<br>')}
                </div>` : ''}
            </div>
          </div>
          ` : ''}

          <!-- Step 4: Process -->
          <div class="step ${stepClass(stepProcess, nextStep===(willScan?4:2))}">
            <div class="step-icon">${stepProcess ? '✓' : willScan?'4':'2'}</div>
            <div class="step-body">
              <div class="step-title">Process — build PDF + derivatives</div>
              <div class="step-desc">Processor replaces pages, runs OCR, generates JPG and transparent PNG. Runs automatically when files are ready.</div>
              <div class="step-cmd">python3 ~/atte-processor/atte_processor.py</div>
              <div class="step-actions">
                <button class="btn btn-primary" onclick="runAction('process')" ${!bridgeOk?'disabled':''}>
                  ${proc && proc.running ? 'Processor running ✓' : 'Start processor'}
                </button>
                <span style="font-size:10px;color:var(--muted)">auto-runs when files appear</span>
              </div>
              ${stepProcess ? `<div style="margin-top:5px;font-size:11px;color:var(--done-text)">✓ Final PDF ready</div>` : ''}
            </div>
          </div>

          <!-- Step 5: Review -->
          <div class="step ${stepClass(stepDerivs, nextStep===(willScan?5:3))}">
            <div class="step-icon">${stepDerivs ? '✓' : willScan?'5':'3'}</div>
            <div class="step-body">
              <div class="step-title">Review output</div>
              <div class="step-desc">Check PDF quality and derivatives in Nextcloud. Enter item in Grist. Complete PD verification if needed.</div>
              <div class="step-actions">
                ${stepProcess ? `<button class="btn btn-teal" onclick="openPdf()" ${!bridgeOk?'disabled':''}>Open PDF</button>` : ''}
                <span style="font-size:10px;color:var(--muted)">${s ? s.derivatives_count + ' derivative(s) generated' : ''}</span>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- STATUS TAB -->
    <div class="tab-content ${activeTab==='status'?'active':''}" id="tab-status">
      <div class="section">
        ${s ? `
        <div class="status-grid">
          <div class="status-item ${s.czur_pdf_ready?'ok':'warn'}">
            <div class="status-label">CZUR PDF</div>
            <div class="status-val">${s.czur_pdf_ready ? '✓ Ready' : '✗ Missing'}</div>
          </div>
          <div class="status-item ${s.tiffs_in_workspace>0?'ok':''}">
            <div class="status-label">Flatbed TIFFs (workspace)</div>
            <div class="status-val">${s.tiffs_in_workspace} file(s)</div>
          </div>
          <div class="status-item ${s.pagemap_exists?'ok':''}">
            <div class="status-label">Page map</div>
            <div class="status-val">${s.pagemap_exists ? '✓ Set' : willScan ? '— Not set' : 'N/A'}</div>
          </div>
          <div class="status-item ${s.masters_count>0?'ok':''}">
            <div class="status-label">Masters (Nextcloud)</div>
            <div class="status-val">${s.masters_count} TIFF(s)</div>
          </div>
          <div class="status-item ${s.derivatives_count>0?'ok':''}">
            <div class="status-label">Derivatives</div>
            <div class="status-val">${s.derivatives_count} JPG(s)</div>
          </div>
          <div class="status-item ${s.final_pdf_ready?'ok':'warn'}">
            <div class="status-label">Final PDF</div>
            <div class="status-val">${s.final_pdf_ready ? '✓ Ready' : '✗ Not yet'}</div>
          </div>
        </div>
        ${s.master_names.length > 0 ? `
          <div style="margin-top:10px;font-size:11px;color:var(--muted)">
            <strong>Masters:</strong><br>
            ${s.master_names.join('<br>')}
          </div>` : ''}
        ` : `<div class="empty-state">Bridge offline — start atte_bridge.py to see file status</div>`}
      </div>
    </div>

    <!-- LOG TAB -->
    <div class="tab-content ${activeTab==='log'?'active':''}" id="tab-log">
      <div class="section">
        ${proc && proc.recent_log && proc.recent_log.length > 0 ? `
          <div class="log-box">
            ${proc.recent_log.map(l => {
              const cls = l.includes('DONE') || l.includes('✓') || l.includes('complete') ? 'ok' :
                          l.includes('Error') || l.includes('failed') || l.includes('✗') ? 'err' : 'info';
              return `<div class="log-line ${cls}">${l}</div>`;
            }).join('')}
          </div>
        ` : `<div style="color:var(--muted);font-style:italic;font-size:12px">No recent log entries — start the processor to see activity</div>`}
      </div>
    </div>
  `;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
async function runAction(action) {
  if (!bridgeOk) {
    alert('Bridge server is offline.\nRun: python3 ~/atte-processor/atte_bridge.py');
    return;
  }
  try {
    const r = await fetch(`${BRIDGE}/run/${action}`, { method: 'POST' });
    const data = await r.json();
    console.log(action, data);
    setTimeout(refresh, 3000);
  } catch(e) {
    console.error(e);
  }
}

async function openPdf() {
  if (!currentItem) return;
  try {
    await fetch(`${BRIDGE}/run/open-pdf`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({item_id: currentItem.item_id})
    });
  } catch(e) { console.error(e); }
}

function switchTab(tab) {
  activeTab = tab;
  render();
}

// Initial bridge check
checkBridge();
setInterval(checkBridge, 15000);
</script>
</body>
</html>
